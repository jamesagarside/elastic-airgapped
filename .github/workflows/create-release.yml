name: Create GitHub Release

on:
  push:
    branches: [main]
    paths:
      - '.env.example'

permissions:
  contents: write

jobs:
  release:
    name: Create release for new Elastic Stack version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Elastic Stack version
        id: version
        run: |
          VERSION=$(grep -oP '^ELASTIC_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' .env.example || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Elastic Stack version: $VERSION"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          MINOR="${NEW_VERSION%.*}"
          RELEASE_NOTES="## Elastic Stack ${NEW_VERSION}

Updated to Elastic Stack \`${NEW_VERSION}\`.

See the [Elastic ${MINOR} release notes](https://www.elastic.co/guide/en/elasticsearch/reference/${MINOR}/release-notes-${NEW_VERSION}.html) for full details."

          gh release create "v${NEW_VERSION}" \
            --title "Elastic Stack ${NEW_VERSION}" \
            --notes "$RELEASE_NOTES" \
            --target main
          echo "Release v${NEW_VERSION} created"
